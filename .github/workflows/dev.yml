---
name: ci

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
  # Run CI manually
  workflow_dispatch:

jobs:
  lint:
    uses: "./.github/workflows/python-checks.yml"
    with:
      python-version: "3.15"
    secrets:
      # This will allow installing pip packages from a package repository.
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.14", "3.15"]
    uses: "./.github/workflows/python-tests.yml"
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
    secrets:
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  test_with_db:
    needs: lint
    uses: "./.github/workflows/python-tests-with-db.yml"
    secrets:
      package-repo: ${{ secrets.PKG_REPOSITORY }}

  # Proves the built wheel installs on its own and runs, with no source tree around it.
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Build the wheel and the sdist"
        run: |
          python -m pip install build
          python -m build -o dist

      - name: "Install the wheel in a clean environment and run it"
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python-template --version
          /tmp/clean/bin/python-template feed --times 2 --json
          /tmp/clean/bin/python-template guide | head -3
          /tmp/clean/bin/python-template man --raw | head -1

  # Proves the template still works after "Use this template" and a rename.
  rename:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: "Rename the package the way a new repository would"
        run: |
          python scripts/rename.py acme_widgets
          test -d src/acme_widgets && test ! -d src/python_template
          test -f src/acme_widgets/data/acme-widgets.1 && test ! -e .claude-plugin

      - name: "Install and run every check under the new name"
        run: |
          make init-dev
          make man
          make checks
          acme-widgets status --json
